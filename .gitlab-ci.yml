# DESCRIPTION: GitLab CI/CD for libRetro (NOT FOR GitLab-proper)

##############################################################################
################################# BOILERPLATE ################################
##############################################################################

# Core definitions
.core-defs:
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    MAKEFILE_PATH: libretro
    CORENAME: amiberry

.linux-defs:
  variables:
    platform: unix
    # Amiberry is C++17 and uses <filesystem>, so both Linux jobs need a
    # newer compiler than the one the images default to.
    CC: gcc-12
    CXX: g++-12

# Inclusion templates, required for the build to work
include:
  ################################## DESKTOPS ################################
  # Windows 64-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/windows-x64-mingw.yml'

  # Linux 64-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/linux-x64.yml'

  # Linux ARM 64-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/linux-aarch64.yml'

  # macOS ARM 64-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/osx-arm64.yml'

  # macOS 64-bit (Intel)
  - project: 'libretro-infrastructure/ci-templates'
    file: '/osx-x64.yml'

  ################################## CELLPHONES ##############################
  # Android
  - project: 'libretro-infrastructure/ci-templates'
    file: '/android-make.yml'

# Stages for building
stages:
  - build-prepare
  - build-shared
  - build-static

##############################################################################
#################################### STAGES ##################################
##############################################################################

################################### DESKTOPS #################################
# Windows 64-bit
libretro-build-windows-x64:
  extends:
    - .libretro-windows-x64-mingw-make-default
    - .core-defs
  variables:
    # The template defaults to win64, but Amiberry's Makefile uses win.
    platform: win

# Linux 64-bit
libretro-build-linux-x64:
  extends:
    - .libretro-linux-x64-make-default
    - .core-defs
    - .linux-defs
  # The default x64 image is xenial-gcc9; gcc-12 lives in the backports one.
  image: $CI_SERVER_HOST:5050/libretro-infrastructure/libretro-build-amd64-ubuntu:backports

# Linux ARM 64-bit
libretro-build-linux-aarch64:
  extends:
    - .libretro-linux-aarch64-make-default
    - .core-defs
    - .linux-defs

# macOS ARM 64-bit
libretro-build-osx-arm64:
  extends:
    - .libretro-osx-arm64-make-default
    - .core-defs
  variables:
    ARCH: arm64

# macOS 64-bit (Intel)
libretro-build-osx-x64:
  extends:
    - .libretro-osx-x64-make-default
    - .core-defs
  variables:
    ARCH: x86_64
    # The template defaults to 10.9, which predates <filesystem> in libc++.
    MACOSX_DEPLOYMENT_TARGET: "10.15"

################################## CELLPHONES ################################
# Android ARMv8a
#
# No armeabi-v7a job: the 32-bit ARM JIT does not compile in this
# configuration (compemu_arm.h wants N_REGS, which nothing defines here), and
# fsdb_host.cpp narrows a 64-bit timestamp into a 32-bit time_t.
libretro-build-android-arm64-v8a:
  extends:
    - .libretro-android-make-arm64-v8a
    - .core-defs

# Android x86_64
libretro-build-android-x86_64:
  extends:
    - .libretro-android-make-x86_64
    - .core-defs
